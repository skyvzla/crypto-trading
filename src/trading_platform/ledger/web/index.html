<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trade Ledger</title>
  <link rel="stylesheet" href="/ui/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <a class="brand" href="/ui/" aria-label="Trade Ledger">
        <span class="brand-mark">TL</span>
        <span class="brand-name">Trade Ledger</span>
      </a>
      <nav class="nav" aria-label="账本视图">
        <button class="nav-item is-active" data-view="overview">总览</button>
        <button class="nav-item" data-view="orders">订单</button>
        <button class="nav-item" data-view="trades">成交</button>
        <button class="nav-item" data-view="positions">持仓</button>
        <button class="nav-item" data-view="admissions">交易池</button>
      </nav>
      <div class="rail-status">
        <span id="health-dot" class="status-dot"></span>
        <span id="health-label">检查服务</span>
      </div>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div>
          <p class="eyebrow">SPIKE SHORT / CONTROL PLANE</p>
          <h1 id="view-title">运行总览</h1>
        </div>
        <button id="refresh" class="icon-button" title="刷新" aria-label="刷新">↻</button>
      </header>

      <section class="filters" aria-label="筛选条件">
        <label>账户<input id="account-filter" placeholder="全部账户"></label>
        <label>策略<input id="strategy-filter" placeholder="全部策略"></label>
        <label>交易对<input id="symbol-filter" placeholder="全部交易对"></label>
        <button id="apply-filters" class="command">应用</button>
      </section>

      <section id="overview-view" class="view is-visible">
        <div class="metrics">
          <article><span>净盈亏</span><strong id="metric-pnl">--</strong><small>USDT</small></article>
          <article><span>未实现盈亏</span><strong id="metric-unrealized">--</strong><small>USDT</small></article>
          <article><span>当前持仓</span><strong id="metric-positions">--</strong><small>OPEN</small></article>
          <article><span>成交笔数</span><strong id="metric-trades">--</strong><small>FILLS</small></article>
        </div>
        <div class="section-heading">
          <h2>最近订单</h2>
          <span id="overview-updated">--</span>
        </div>
        <div class="table-wrap"><table id="overview-table"></table></div>
      </section>

      <section id="orders-view" class="view">
        <div class="section-heading"><h2>订单账本</h2><span id="orders-count">0 条</span></div>
        <div class="table-wrap"><table id="orders-table"></table></div>
      </section>

      <section id="trades-view" class="view">
        <div class="section-heading"><h2>成交记录</h2><span id="trades-count">0 条</span></div>
        <div class="table-wrap"><table id="trades-table"></table></div>
      </section>

      <section id="positions-view" class="view">
        <div class="section-heading"><h2>当前持仓</h2><span id="positions-count">0 条</span></div>
        <div class="table-wrap"><table id="positions-table"></table></div>
      </section>

      <section id="admissions-view" class="view">
        <div class="admission-toolbar">
          <div class="section-heading"><h2>Subcategory 准入</h2><span id="admissions-count">0 项</span></div>
          <form id="new-admission-form" class="inline-form">
            <input id="new-subcategory" required maxlength="64" placeholder="subcategory">
            <input id="operator" required maxlength="128" placeholder="操作者">
            <button class="command" type="submit">新增准入项</button>
          </form>
        </div>
        <div id="admission-list" class="admission-list"></div>
      </section>

      <div id="notice" class="notice" role="status" aria-live="polite"></div>
    </main>
  </div>
  <script src="/ui/app.js" defer></script>
</body>
</html>
