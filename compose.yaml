services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-trading_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - trading_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - trading_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  market:
    build: &app_build
      context: .
      dockerfile: Dockerfile
      network: host
    command: ["python", "-m", "trading_platform.market"]
    init: true
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MARKET_HOST: 0.0.0.0
      MARKET_PORT: 8000
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      BINANCE_TESTNET: ${BINANCE_TESTNET:-true}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - trading_net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  ledger-migrate:
    image: trading_platform-ledger
    command: ["python", "-m", "trading_platform.ledger.db.migrations", "migrate"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: ${DB_DATABASE:-trading_platform}
    networks:
      - trading_net
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ledger:
    image: trading_platform-ledger
    build: *app_build
    command: ["python", "-m", "trading_platform.ledger"]
    init: true
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: ${DB_DATABASE:-trading_platform}
      BACKTEST_ARCHIVE_INDEX_PATH: ${BACKTEST_ARCHIVE_INDEX_PATH:-/app/data/market/candles/archive_index.parquet}
      LEDGER_HOST: 0.0.0.0
      LEDGER_PORT: 8001
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - trading_net
    depends_on:
      ledger-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  notification-worker:
    image: trading_platform-ledger
    build: *app_build
    command: ["python", "-m", "trading_platform.notifications", "--poll-interval", "5"]
    init: true
    # Connector secret_ref values resolve from this optional file or Docker
    # secrets mounted at /run/secrets. The web UI never stores secret values.
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: ${DB_DATABASE:-trading_platform}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-1}
      NOTIFICATION_REDIS_URL: redis://redis:6379/1
      NOTIFICATION_BRIDGE_LOOKBACK_SECONDS: ${NOTIFICATION_BRIDGE_LOOKBACK_SECONDS:-900}
    volumes:
      - ./logs:/app/logs
    networks:
      - trading_net
    depends_on:
      ledger-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  symbol-sync:
    image: trading_platform-ledger
    build: *app_build
    command: ["python", "-m", "trading_platform.ledger.exchange_symbols", "--watch"]
    init: true
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: ${DB_DATABASE:-trading_platform}
      SPIKE_DELISTING_FREEZE_DAYS: ${SPIKE_DELISTING_FREEZE_DAYS:-15}
      EXCHANGE_SYMBOL_SYNC_INTERVAL_SECONDS: ${EXCHANGE_SYMBOL_SYNC_INTERVAL_SECONDS:-86400}
    networks:
      - trading_net
    depends_on:
      ledger-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  spike:
    profiles: ["spike"]
    build: *app_build
    command: ["python", "-m", "trading_platform.strategies.spike.main"]
    init: true
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: ${DB_DATABASE:-trading_platform}
      STRATEGY_ACCOUNT_ID: ${SPIKE_ACCOUNT_ID:-spike_testnet}
      STRATEGY_MARKET_API_URL: http://market:8000
      STRATEGY_RISK_MAX_POSITION_VALUE_USDT: ${STRATEGY_RISK_MAX_POSITION_VALUE_USDT:-1000}
      STRATEGY_RISK_MAX_SYMBOLS: ${STRATEGY_RISK_MAX_SYMBOLS:-1}
      SPIKE_MODE: ${SPIKE_MODE:-testnet}
      SPIKE_EXIT_POLICY: ${SPIKE_EXIT_POLICY:-candidate-v1}
      SPIKE_ACCOUNT_ID: ${SPIKE_ACCOUNT_ID:-spike_testnet}
      SPIKE_SYMBOLS: ${SPIKE_SYMBOLS:-AKEUSDT}
      SPIKE_INITIAL_ACCOUNT_CAPITAL: ${SPIKE_INITIAL_ACCOUNT_CAPITAL:-100}
      SPIKE_INITIAL_TRADING_CAPITAL: ${SPIKE_INITIAL_TRADING_CAPITAL:-50}
      SPIKE_PROFIT_REINVEST_RATIO: ${SPIKE_PROFIT_REINVEST_RATIO:-0.5}
      SPIKE_MINIMUM_TRADING_CAPITAL: ${SPIKE_MINIMUM_TRADING_CAPITAL:-10}
      SPIKE_ENTRY_TIER_MODE: ${SPIKE_ENTRY_TIER_MODE:-single-entry}
      SPIKE_WAL_PATH: /app/data/wal/spike_short.jsonl
      SPIKE_DEDICATED_STRATEGY_ACCOUNT: "true"
      SPIKE_POLL_INTERVAL_SECONDS: "5"
      SPIKE_MAX_POLL_ATTEMPTS: "12"
      SPIKE_DELISTING_FREEZE_DAYS: ${SPIKE_DELISTING_FREEZE_DAYS:-15}
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      BINANCE_TESTNET: ${BINANCE_TESTNET:-true}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - trading_net
    depends_on:
      postgres:
        condition: service_healthy
      ledger-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      market:
        condition: service_healthy
    restart: unless-stopped

  strategy_kline:
    profiles: ["examples"]
    build: *app_build
    command: ["python", "-m", "trading_platform.strategies.kline.main"]
    init: true
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: ${DB_DATABASE:-trading_platform}
      STRATEGY_ACCOUNT_ID: ${STRATEGY_ACCOUNT_ID:-account_a}
      STRATEGY_MARKET_API_URL: http://market:8000
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      BINANCE_TESTNET: ${BINANCE_TESTNET:-true}
    volumes:
      - ./logs:/app/logs
    networks:
      - trading_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      market:
        condition: service_healthy
    restart: unless-stopped

  strategy_tick:
    profiles: ["examples"]
    build: *app_build
    command: ["python", "-m", "trading_platform.strategies.tick.main"]
    init: true
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: ${DB_DATABASE:-trading_platform}
      STRATEGY_ACCOUNT_ID: ${STRATEGY_ACCOUNT_ID_2:-account_b}
      STRATEGY_MARKET_API_URL: http://market:8000
      BINANCE_API_KEY: ${BINANCE_API_KEY_2:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET_2:-}
      BINANCE_TESTNET: ${BINANCE_TESTNET:-true}
    volumes:
      - ./logs:/app/logs
    networks:
      - trading_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      market:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  trading_net:
