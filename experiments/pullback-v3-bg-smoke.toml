name = "pullback-v3-bg-smoke"
start = "2025-08-01T00:00:00+00:00"
end = "2026-08-01T00:00:00+00:00"
duckdb_path = "data/market/candles/candles.duckdb"
output = "reports/pullback-v3-bg-smoke"

[universe]
mode = "explicit"
require_database_allowed = false
symbols = [
    "VELVETUSDT",
    "COAIUSDT",
    "MONUSDT",
    "API3USDT",
    "MOODENGUSDT",
    "PROMPTUSDT",
    "AKEUSDT",
    "BANKUSDT",
    "GMXUSDT",
]

[execution]
memory_limit_enabled = false
chunk_hours = 2880
fetch_batch_size = 10000
duckdb_threads = 1
resume = true

[fixed]
strategy = "trading_platform.strategies.spike.pullback:PullbackV3"
total_notional = 1000
exit_policy = "candidate-v1"
warmup_hours = 40
rise_60s_threshold = 0.40
cooldown_seconds = 180
take_profit = 0
wait_seconds = 90
min_spike_rise = 0.40

# 深回撤保护与 dd-db 一致
profit_drawdown_peak_ratio = 0.20
profit_drawdown_ratio = 0.10

[matrix]
# 背景/入场门槛 (基线: prior_high=4h, min_rise=6h, retrace=0.30)
# 放宽 prior_high 回溯(4/12h)、放宽起涨时长(6/2h)、加深回落(0.30/0.40) 的组合
"prior_high_lookback_hours" = [4, 12]
"min_rise_duration_hours" = [6, 2]
"retrace_frac" = [0.30, 0.40]

[analysis]
collision_tolerance_seconds = 1
pnl_split_usdt = 10
breakout_windows_hours = [4, 6, 8, 12, 24]
box_proximity_percentages = [1, 3, 5, 10]