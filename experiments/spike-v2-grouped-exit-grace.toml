name = "spike-v2-grouped-exit-grace"
start = "2025-08-01T00:00:00+00:00"
end = "2026-08-01T00:00:00+00:00"
duckdb_path = "data/market/candles/candles.duckdb"
output = "reports/spike-v2-grouped-exit-grace"
metrics_root = "data/market/metrics"

[universe]
mode = "anomaly-report"
anomaly_report = "reports/spike-v2-consecutive-ls-audit/universe.csv"
strategy_id = "spike_short"
freeze_days = 15
new_listing_mark_days = 30
coverage_tolerance_hours = 24
exclude_symbols = ["ZECUSDT"]

[execution]
memory_limit_enabled = false
chunk_hours = 4320
fetch_batch_size = 10000
duckdb_threads = 1
resume = true

[fixed]
strategy = "trading_platform.strategies.spike.v2_1:V21"
total_notional = 1000
exit_policy = "candidate-v1"
warmup_hours = 168
entry_tier_mode = "tier3-only"
prior_high_lookback_hours = 6
rise_low_lookback_hours = 168
min_rise_duration_hours = 24
profit_unlock_percent = 1.5
max_oi_change_pct = 0
max_ls_ratio = 1.5
max_consecutive_up_minutes = 4
group_rise_12h_threshold = 1.0
loose_consecutive_up_minutes = 0
strong_tier_atr_shift = 0.2

[matrix]
time_risk_grace_ms = [0, 900000, 1800000, 2700000]
time_risk_grace_loss_ratio = [0.01, 0.02]

[analysis]
collision_tolerance_seconds = 1
pnl_split_usdt = 10
breakout_windows_hours = [4, 6, 8, 12, 24]
box_proximity_percentages = [1, 3, 5, 10]