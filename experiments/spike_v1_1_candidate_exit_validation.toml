  "DOODUSDT",
  "ESPORTSUSDT",
  "FHEUSDT",
  "FUSDT",
  "HEIUSDT",
  "HMSTRUSDT",
  "HUMAUSDT",
  "HUSDT",
  "IDOLUSDT",
  "IOTAUSDT",
  "JELLYJELLYUSDT",
  "KOMAUSDT",
  "LUMIAUSDT",
  "MYXUSDT",
  "NAORISUSDT",
  "PIPPINUSDT",
