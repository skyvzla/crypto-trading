[execution]
memory_limit_enabled = false
chunk_hours = 4320
fetch_batch_size = 10000
worker_memory_budget = "2GB"
memory_budget_percent = 95
duckdb_threads = 1
resume = true

[fixed]
# 基线参数。若同名参数也出现在 [matrix]，matrix 的每个值会覆盖这里的基线值。
# 建议每次先只把一个待研究参数放入 [matrix]，确定后将最佳值写回本节。
strategy = "trading_platform.strategies.spike.v1_1:V11"
# 每笔固定名义金额，不随历史收益复利。
total_notional = 1000
# 复用 v1 的候选退出状态机；不要改为 confirmed，否则结果不可与 v1.1 比较。
exit_policy = "candidate-v1"
# 上市后首笔信号前最多用于预热的历史；新币从其上市时间起开始加载。
warmup_hours = 16
# v1.1 固定只挂第三档，整笔 1000 USDT 名义金额。
entry_tier_mode = "tier3-only"
# 前高观察窗口；本实验固定 4h，避免同时扩大矩阵维度。
prior_high_lookback_hours = 4
# 5 秒涨幅下限，单位 %；数值越大越严格、信号越少。
rise_5s_threshold_percent = 5
# 第三档最低挂单价允许低于 4h 前高的比例，单位 %；数值越大越宽松、信号越多。
prior_high_tolerance_percent = 5
# 0 为关闭；正数为连续 1m 阳线根数上限，数值越小越严格。
max_consecutive_up_minutes = 0
# 0 为关闭；正数为相邻 5m OI 涨幅上限，单位 %，数值越小越严格。
max_oi_change_pct = 0
# 0 为关闭；正数为全市场多空比上限，数值越小越严格。
max_ls_ratio = 0

# 参数矩阵做笛卡尔积：当前启用 2 x 3 x 2 = 12 组，每个纳入币种各跑一次。
# 不要一次扩大多个维度。推荐顺序：
# 1. 仅扫描 rise_5s_threshold_percent = [3, 4, 5, 6]；其余参数保留在 [fixed]。
# 2. 固定最佳涨幅阈值，再仅扫描 prior_high_tolerance_percent = [0, 3, 5, 7]。
# 3. 最后只对两个候选基线做 2 x 2 联合验证；连阳、OI、多空比另开独立实验。
[matrix]
# 涨幅越高越严格。当前只比较宽松 3% 与严格 5%。
# rise_5s_threshold_percent = [3, 5]
# 容忍度越高越宽松。建议先单独试 [0, 3, 5, 7]，再决定是否与涨幅阈值联合。
prior_high_tolerance_percent = [3, 5]
# 连阳上限：0 是关闭；若要单独研究，使用 [0, 2, 3, 5]，不要与其他过滤同时展开。
# max_consecutive_up_minutes = [0, 3]
# OI 上限：0 是关闭；15 表示 OI 单个 5m 快照涨幅超过 15% 才过滤。
# 指标快照缺失时不会被该过滤拒绝，因此需结合 all_signals.csv 检查指标覆盖。
max_oi_change_pct = [0, 10, 15]
# 多空比上限：0 是关闭；1.5 表示多空比超过 1.5 时过滤。
max_ls_ratio = [0, 1.5]
# 5 秒涨幅上限：0 是关闭；值必须不低于 rise_5s_threshold_percent，超过上限的候选信号会被拒绝。
# 建议先单独试 [0, 7.5, 10]，不要和 OI、多空比矩阵同时展开。
# max_rise_5s_percent = [0, 7.5, 10]
# 5 秒量能倍数上限：0 是关闭；最小值为 3，超过上限的候选信号会被拒绝。
# 建议在固定涨幅上限后单独试 [0, 10, 15]。
# max_volume_multiple_5s = [0, 10, 15]

[analysis]
collision_tolerance_seconds = 1
pnl_split_usdt = 10
breakout_windows_hours = [4, 6, 8, 12, 24]
box_proximity_percentages = [1, 3, 5, 10]
