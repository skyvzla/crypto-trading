# v1.1 candidate-v1 退出修正验证：仅补跑原收益最高参数组及其历史信号币种。
name = "spike-v1-1-candidate-exit-validation"
start = "2025-08-01T00:00:00+00:00"
end = "2026-08-01T00:00:00+00:00"
duckdb_path = "data/market/history.duckdb"
output = "reports/spike-v1-1-candidate-exit-validation"
metrics_root = "data/market/metrics"

[universe]
mode = "explicit"
strategy_id = "spike_short"
freeze_days = 15
coverage_tolerance_hours = 24
exclude_symbols = []
symbols = [
  "1000000BOBUSDT",
  "AGTUSDT",
  "AINUSDT",
  "AIOTUSDT",
  "ALPINEUSDT",
  "API3USDT",
  "ARCUSDT",
  "B2USDT",
