# XNY/GIGGLE 组合验证：7.5% 5秒涨幅上限 + 10倍量能上限。
name = "spike-risk-two-symbols-v1-1-caps-7-5-vol10"
start = "2025-08-01T00:00:00+00:00"
end = "2026-08-01T00:00:00+00:00"
duckdb_path = "data/market/history.duckdb"
output = "reports/spike-risk-two-symbols-v1-1-caps-7-5-vol10"
