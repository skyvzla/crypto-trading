# XNY 复核：基础急涨后只接受已完成 5m K 线确认的顶部成熟度候选。
# 5m TD 与相对量能均取原生已完成 5m K 线；不使用 1m 聚合。
name = "spike-v2-xny-top-maturity"
start = "2025-12-01T00:00:00+00:00"
end = "2025-12-06T00:00:00+00:00"
duckdb_path = "data/market/candles/candles.duckdb"
output = "reports/spike-v2-xny-top-maturity"
metrics_root = "data/market/metrics"

[universe]
mode = "explicit"
strategy_id = "spike_short"
freeze_days = 15
new_listing_mark_days = 30
coverage_tolerance_hours = 24
symbols = ["XNYUSDT"]

[execution]
memory_limit_enabled = false
chunk_hours = 4320
fetch_batch_size = 10000
duckdb_threads = 1
resume = true

[fixed]
strategy = "trading_platform.strategies.spike.v2_1:V21"
total_notional = 1000
exit_policy = "candidate-v1"
warmup_hours = 168
entry_tier_mode = "tier3-only"
prior_high_lookback_hours = 6
rise_low_lookback_hours = 168
min_rise_duration_hours = 24
profit_unlock_percent = 1.5
max_consecutive_up_minutes = 0
max_oi_change_pct = 0
max_ls_ratio = 1.5

[matrix]
max_rise_5s_percent = [0, 6]
min_td_sell_setup_5m = [0, 3, 4, 5]
min_volume_multiple_5m = [0, 5, 10]

[analysis]
collision_tolerance_seconds = 1
pnl_split_usdt = 10
breakout_windows_hours = [4, 6, 8, 12, 24]
box_proximity_percentages = [1, 3, 5, 10]
