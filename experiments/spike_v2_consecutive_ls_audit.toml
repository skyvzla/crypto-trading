# V21 连阳与多空比交互回测。独立输出，避免混入使用旧 strategy_version 的历史结果。
# 四臂均以 OI 关闭为固定基线：无过滤、连阳=3、LS=1.5、连阳=3 + LS=1.5。
name = "spike-v2-consecutive-ls-audit"
start = "2025-08-01T00:00:00+00:00"
end = "2026-08-01T00:00:00+00:00"
duckdb_path = "data/market/candles/candles.duckdb"
output = "reports/spike-v2-consecutive-ls-audit"
metrics_root = "data/market/metrics"

[universe]
