# Spike v2 全量回测配置。
# 运行：python -m trading_platform.backtest.sweep \
#   --config experiments/spike_sweep_v2.example.toml --workers 5

name = "spike-v2-parameter-sweep"
start = "2025-08-01T00:00:00+00:00"
end = "2026-08-01T00:00:00+00:00"
duckdb_path = "data/market/history.duckdb"
output = "reports/spike-v2-parameter-sweep"

[universe]
# 仅回测 v1 的6h前高版本实际产生过交易的92个标的。
# explicit 模式仍会读取主库，数据库禁用或缺少1秒归档的标的不参与回测。
mode = "explicit"
symbols = [
  "1000000BOBUSDT", "1000RATSUSDT", "2ZUSDT", "4USDT", "AGTUSDT",
  "AINUSDT", "AIOUSDT", "AKEUSDT", "ALCHUSDT", "ALPINEUSDT", "API3USDT",
  "ARCUSDT", "AVAAIUSDT", "BANANAS31USDT", "BANKUSDT", "BANUSDT",
  "BEATUSDT", "BELUSDT", "BIRBUSDT", "BLUAIUSDT", "BOMEUSDT",
  "BROCCOLIF3BUSDT", "BRUSDT", "BSBUSDT", "BTWUSDT", "BULLAUSDT", "BUSDT",
  "CLOUSDT", "COAIUSDT", "COLLECTUSDT", "CTSIUSDT", "DEXEUSDT", "DODOXUSDT",
  "DOGSUSDT", "DUSKUSDT", "ESPORTSUSDT", "ESPUSDT", "ETHWUSDT", "EVAAUSDT",
  "FFUSDT", "FHEUSDT", "FLUXUSDT", "FOLKSUSDT", "FORMUSDT", "FUSDT",
  "GIGGLEUSDT", "GPSUSDT", "HEIUSDT", "HMSTRUSDT", "HUSDT", "IDOLUSDT",
  "IOTAUSDT", "JELLYJELLYUSDT", "KGENUSDT", "KOMAUSDT", "LABUSDT",
  "LUMIAUSDT", "MAGMAUSDT", "MITOUSDT", "MMTUSDT", "MYXUSDT", "NAORISUSDT",
  "ONUSDT", "PAXGUSDT", "PIPPINUSDT", "PLAYUSDT", "PNUTUSDT", "POWERUSDT",
  "PRLUSDT", "PUMPBTCUSDT", "RAVEUSDT", "RIVERUSDT", "SIRENUSDT",
  "SKYAIUSDT", "SLXUSDT", "SPKUSDT", "STGUSDT", "STOUSDT", "SWARMSUSDT",
  "SYNUSDT", "TACUSDT", "TAIKOUSDT", "TRADOORUSDT", "UAIUSDT", "USTCUSDT",
  "VELVETUSDT", "WCTUSDT", "XNYUSDT", "XPINUSDT", "ZEREBROUSDT",
  "币安人生USDT", "我踏马来了USDT",
]
strategy_id = "spike_short"
freeze_days = 15
coverage_tolerance_hours = 24
exclude_symbols = ["ZECUSDT"]

[execution]
# 关闭限制时必须在命令行显式传 --workers；每个交易对只读取一次共享行情。
memory_limit_enabled = false
chunk_hours = 2160
fetch_batch_size = 10000
worker_memory_budget = "4GB"
duckdb_threads = 1
memory_budget_percent = 90
resume = true

[fixed]
# v1 仍由原配置和历史报告保留；本文件所有结果明确标记为 v2。
strategy_version = "v2"
total_notional = 1000
exit_policy = "candidate-v1"
# 自动预热7天，确保上涨低点窗口完整。
warmup_hours = 168
# 三档中仅提交第三档，第三档使用100%名义金额。
entry_tier_mode = "tier3-only"
# 最低档价格必须高于信号前6小时最高价。
prior_high_lookback_hours = 6
# 信号前7天最低点的最近一次出现，距信号至少24小时。
rise_low_lookback_hours = 168
min_rise_duration_hours = 24
# 空仓价格盈利严格大于1.5%后，永久解除首90秒风险退出保护。
profit_unlock_percent = 1.5

[matrix]
# 后续对比参数直接从 fixed 移到这里并填写数组，例如：
# profit_unlock_percent = [1.0, 1.5, 2.0]
# min_rise_duration_hours = [12, 24, 36]

[analysis]
collision_tolerance_seconds = 1
pnl_split_usdt = 10
breakout_windows_hours = [4, 6, 8, 12, 24]
box_proximity_percentages = [1, 3, 5, 10]
