name = "spike-v2-grouped-exit-deep-drawdown-smoke"
start = "2025-08-01T00:00:00+00:00"
end = "2026-08-01T00:00:00+00:00"
duckdb_path = "data/market/candles/candles.duckdb"
output = "reports/spike-v2-grouped-exit-deep-drawdown-smoke"
metrics_root = "data/market/metrics"

[universe]
mode = "explicit"
symbols = ["XNYUSDT", "BSBUSDT", "BULLAUSDT", "FHEUSDT", "AKEUSDT", "LABUSDT", "BUSDT", "PRLUSDT", "DUSKUSDT", "ALCHUSDT", "BANANAS31USDT", "FFUSDT", "ESPUSDT"]

[execution]
memory_limit_enabled = false
chunk_hours = 4320
fetch_batch_size = 10000
duckdb_threads = 1
resume = true

[fixed]
strategy = "trading_platform.strategies.spike.v2_1:V21"
total_notional = 1000
exit_policy = "candidate-v1"
warmup_hours = 168
entry_tier_mode = "tier3-only"
prior_high_lookback_hours = 6
rise_low_lookback_hours = 168
min_rise_duration_hours = 24
profit_unlock_percent = 1.5
max_oi_change_pct = 0
max_ls_ratio = 1.5
max_consecutive_up_minutes = 4
group_rise_12h_threshold = 1.0
loose_consecutive_up_minutes = 0
strong_tier_atr_shift = 0.2
exit_strict_age_ms = 900000

# 深回撤保护（解耦版）：profit_drawdown_peak_ratio = 峰值浮盈前置（粘滞 arm），
# profit_drawdown_ratio = 从峰值回撤比例。0 哨兵 = 关闭（run 层 0 → None）。
# 基线 = 0/0；峰值浮盈 20% 后回撤 8%/10%/12% 为候选。
[matrix]
profit_drawdown_peak_ratio = [0, 0.20, 0.20, 0.20, 0.20]
profit_drawdown_ratio = [0, 0.08, 0.10, 0.12, 0.15]

[analysis]
collision_tolerance_seconds = 1
pnl_split_usdt = 10
breakout_windows_hours = [4, 6, 8, 12, 24]
box_proximity_percentages = [1, 3, 5, 10]