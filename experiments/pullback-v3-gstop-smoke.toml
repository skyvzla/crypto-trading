name = "pullback-v3-gstop-smoke"
start = "2025-08-01T00:00:00+00:00"
end = "2026-08-01T00:00:00+00:00"
duckdb_path = "data/market/candles/candles.duckdb"
output = "reports/pullback-v3-gstop-smoke"

[universe]
mode = "explicit"
require_database_allowed = false
symbols = [
    "VELVETUSDT", "COAIUSDT", "MONUSDT", "API3USDT", "MOODENGUSDT",
    "PROMPTUSDT", "AKEUSDT", "BANKUSDT", "GMXUSDT",
]

[execution]
memory_limit_enabled = false
chunk_hours = 2880
fetch_batch_size = 10000
duckdb_threads = 1
resume = true

[fixed]
strategy = "trading_platform.strategies.spike.pullback:PullbackV3"
total_notional = 1000
exit_policy = "candidate-v1"
warmup_hours = 40
rise_60s_threshold = 0.40
cooldown_seconds = 180
rise_low_lookback_hours = 24
min_rise_duration_hours = 6
prior_high_lookback_hours = 4
prior_high_tolerance_percent = 0
min_spike_rise = 0.40
retrace_frac = 0.30
take_profit = 0
wait_seconds = 90
profit_drawdown_peak_ratio = 0.20
profit_drawdown_ratio = 0.10
exit_stable_breakout_age_ms = 90000

[matrix]
# 被 age 门挡期间的逆势止损阈值：None=单档age(不用0哨兵,置matrix=null不可行), 用极值从大到小模拟
# sweep 不支持 None 矩阵值 → 用 0 表示关闭(策略0-1校验, 0=不触发)
stable_breakout_gate_stop_pct = [0.0, 0.15, 0.20, 0.25, 0.30]

[analysis]
collision_tolerance_seconds = 1
pnl_split_usdt = 10
breakout_windows_hours = [4, 6, 8, 12, 24]
box_proximity_percentages = [1, 3, 5, 10]
