# 与 caps-7-5-vol10-full 相同币池/区间的 v1.1 基线，用于全量对照。
# 关闭新增的涨幅和量能上限，其余参数、candidate-v1 退出和第三档成交保持一致。
name = "spike-v1-1-caps-baseline-full"
start = "2025-08-01T00:00:00+00:00"
end = "2026-08-01T00:00:00+00:00"
duckdb_path = "data/market/history.duckdb"
output = "reports/spike-v1-1-caps-baseline-full-oi10-chunk4320"
metrics_root = "data/market/metrics"

[universe]
mode = "database"
strategy_id = "spike_short"
freeze_days = 15
coverage_tolerance_hours = 24
exclude_symbols = []

[execution]
memory_limit_enabled = false
chunk_hours = 4320
fetch_batch_size = 10000
duckdb_threads = 1
resume = true

[fixed]
strategy = "trading_platform.strategies.spike.v1_1:V11"
total_notional = 1000
exit_policy = "candidate-v1"
warmup_hours = 16
entry_tier_mode = "tier3-only"
prior_high_lookback_hours = 4
rise_5s_threshold_percent = 5
max_consecutive_up_minutes = 0
max_oi_change_pct = 10
max_ls_ratio = 0
prior_high_tolerance_percent = 5
max_rise_5s_percent = 0
max_volume_multiple_5s = 0

[analysis]
collision_tolerance_seconds = 1
pnl_split_usdt = 10
breakout_windows_hours = [4, 6, 8, 12, 24]
box_proximity_percentages = [1, 3, 5, 10]
