[project]
name = "spike-trading-platform"
version = "0.1.0"
description = "Event-driven spike short trading and backtesting platform"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4,<2.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=2.0,<2.8",
    "pandas>=2.3",
    "psycopg[binary,pool]>=3.2,<4.0",
    "pyarrow>=20.0",
    "pydantic-settings>=2.10",
    "redis>=5.2,<6.0",
    "uvicorn>=0.30",
    "websocket-client>=1.8",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
]

[project.scripts]
spike-live = "trading_platform.strategies.spike_main:main"
ledger-migrate = "trading_platform.ledger.db.migrations:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["trading_platform*"]

[tool.setuptools.package-data]
"trading_platform.ledger" = ["web/*.html", "web/*.css", "web/*.js"]
"trading_platform.ledger.db" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
