name: trading_platform_test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trading_platform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trading_platform"]
      interval: 1s
      timeout: 2s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 10

  notification-worker:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    command:
      - sh
      - -ceu
      - >-
        python -m trading_platform.ledger.db.migrations migrate &&
        python -m trading_platform.notifications --once --no-redis
    environment:
      PYTHONPATH: /app/src
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: trading_platform
    depends_on:
      postgres:
        condition: service_healthy

  test:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    command: ["uv", "run", "pytest", "-q", "-n", "13"]
    environment:
      PYTHONPATH: /app/src
      TEST_REDIS_URL: redis://redis:6379/15
      LEDGER_TEST_DSN: postgresql://postgres:postgres@postgres:5432/trading_platform
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
