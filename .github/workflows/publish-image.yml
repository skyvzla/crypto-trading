name: Publish application image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a stable semantic version tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tags must use stable vMAJOR.MINOR.PATCH format" >&2
            exit 1
          }

      - name: Ensure release commit is on main
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Normalize image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=sha,format=long,prefix=sha-

      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create deployment bundle and checksum
        id: bundle
        run: |
          bundle="$RUNNER_TEMP/deploy-bundle.tar.gz"
          checksum="$bundle.sha256"
          bash deploy/create-release-bundle.sh "$GITHUB_REF_NAME" "$bundle"
          (cd "$RUNNER_TEMP" && sha256sum "$(basename "$bundle")" > "$(basename "$checksum")")
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_PATH: ${{ steps.bundle.outputs.bundle }}
          CHECKSUM_PATH: ${{ steps.bundle.outputs.checksum }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$BUNDLE_PATH#deploy-bundle.tar.gz" \
            "$CHECKSUM_PATH#deploy-bundle.tar.gz.sha256" \
            "deploy/deploy-release.sh#deploy-release.sh" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
