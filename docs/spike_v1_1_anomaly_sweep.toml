# v1.1 指标组合实验：保留 v1 三档挂单和确认退出，只比较入场过滤条件。
name = "spike-v1-1-anomaly-sweep"
start = "2025-08-01T00:00:00+00:00"
end = "2026-08-01T00:00:00+00:00"
duckdb_path = "data/market/history.duckdb"
output = "reports/spike-v1-1-anomaly-sweep"
metrics_root = "data/market/metrics"

[universe]
mode = "anomaly-report"
anomaly_report = "reports/upper_wicks_15m_over_20pct_20250801_20260731.csv"
strategy_id = "spike_short"
freeze_days = 15
coverage_tolerance_hours = 24
exclude_symbols = ["ZECUSDT"]

[execution]
memory_limit_enabled = false
chunk_hours = 2160
fetch_batch_size = 10000
duckdb_threads = 1
resume = true

[fixed]
strategy = "trading_platform.strategies.spike.v1_1:V11"
total_notional = 1000
exit_policy = "confirmed"
warmup_hours = 16
entry_tier_mode = "three-tier"
prior_high_lookback_hours = 4

[matrix]
rise_5s_threshold_percent = [3, 5]
prior_high_tolerance_percent = [0, 5]
max_consecutive_up_minutes = [0, 3]
max_oi_change_pct = [0, 15]
max_ls_ratio = [0, 1.5]

[analysis]
collision_tolerance_seconds = 1
pnl_split_usdt = 10
breakout_windows_hours = [4, 6, 8, 12, 24]
box_proximity_percentages = [1, 3, 5, 10]
